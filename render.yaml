services:
  - type: web
    name: brandproof
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: brandproof
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: http://localhost:5173
      - key: DJANGO_STORAGE_BACKEND
        value: local
      - key: PUBLIC_APP_URL
        fromService:
          type: web
          name: brandproof
          envVarKey: RENDER_EXTERNAL_URL
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: DEMO_USERNAME
        value: brandproof-demo
      - key: DEMO_PASSWORD
        sync: false

